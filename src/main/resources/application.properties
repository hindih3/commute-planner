spring.application.name=commute-planner

spring.datasource.url=jdbc:postgresql://localhost:5432/commute
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:dev}

# Parse LocalTime request parameters like ?start=07:30
spring.mvc.format.time=iso

# Be at a stop at least this many minutes before a bus or train leaves
planner.boarding-buffer-minutes=2