spring.application.name=commute-planner

spring.datasource.url=jdbc:postgresql://localhost:5432/commute
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:dev}

# Parse LocalTime request parameters like ?start=07:30
spring.mvc.format.time=iso

# Be at a stop at least this many minutes before a bus or train leaves
planner.boarding-buffer-minutes=2

# Live CTA predictions. The API keys live in .env (never committed), which is
# read as a properties file. Without it the keys are blank, CTA rejects the
# calls, and plans fall back to the schedule.
spring.config.import=optional:file:.env[.properties]
cta.bus-tracker-key=${CTA_BUS_TRACKER_API_KEY:}
cta.train-tracker-key=${CTA_TRAIN_TRACKER_API_KEY:}
# false = plan from the schedule only
cta.live.enabled=true